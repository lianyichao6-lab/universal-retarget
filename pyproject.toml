[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anydexretarget"
version = "0.2.0"
description = "High-precision hand pose retargeting system for WujiHand using Wuji Retargeting algorithm"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.21.0",
    "nlopt",
    "pyyaml",
]

[tool.setuptools]
packages = ["anydexretarget"]

# Important: Ensure URDF and STL files are included in the package
[tool.setuptools.package-data]
"anydexretarget" = [
    "urdf/*.urdf",
    "meshes/**/*.STL",
]

