# LinkerHand L25 Pico 4 simulation bootstrap configuration.
#
# Pico4 emits wrist-relative 21x3 joints. The coordinate correction below is
# inherited from the upstream Linker L20 Pico4 path so that the live input has
# a known-good frame convention. Key-vector scales are an initial L25 baseline
# and require L25 skeleton calibration before quality claims or hardware use.

optimizer:
  type: "KeyVectorOptimizer"

robot:
  type: "linkerhand_l25"

retarget:
  huber_delta: 2.0
  norm_delta: 0.04
  lp_alpha: 0.4
  segment_scaling:
    thumb: [1.727, 1.53, 1.417]
    index: [1.617, 1.624, 1.579]
    middle: [1.58, 1.548, 1.47]
    ring: [1.613, 1.613, 1.55]
    pinky: [1.806, 1.821, 1.74]

  key_vectors:
    # thumb
  - {origin: hand_base_link, task: thumb_proximal, origin_kp: 0, task_kp: 2, scale: 1.466}
  - {origin: hand_base_link, task: thumb_distal, origin_kp: 0, task_kp: 3, scale: 1.586}
  - {origin: hand_base_link, task: thumb_distal, origin_kp: 0, task_kp: 4, task_offset: [-0.0110, 0.0, 0.0277], scale: 1.338}
    # index
  - {origin: hand_base_link, task: index_middle, origin_kp: 0, task_kp: 6, scale: 1.476}
  - {origin: hand_base_link, task: index_distal, origin_kp: 0, task_kp: 7, scale: 1.581}
  - {origin: hand_base_link, task: index_distal, origin_kp: 0, task_kp: 8, task_offset: [-0.0135, 0.0, 0.0188], scale: 1.522}
    # middle
  - {origin: hand_base_link, task: middle_middle, origin_kp: 0, task_kp: 10, scale: 1.469}
  - {origin: hand_base_link, task: middle_distal, origin_kp: 0, task_kp: 11, scale: 1.536}
  - {origin: hand_base_link, task: middle_distal, origin_kp: 0, task_kp: 12, task_offset: [-0.0135, 0.0, 0.0188], scale: 1.452}
    # ring
  - {origin: hand_base_link, task: ring_middle, origin_kp: 0, task_kp: 14, scale: 1.469}
  - {origin: hand_base_link, task: ring_distal, origin_kp: 0, task_kp: 15, scale: 1.575}
  - {origin: hand_base_link, task: ring_distal, origin_kp: 0, task_kp: 16, task_offset: [-0.0135, 0.0, 0.0188], scale: 1.51}
    # pinky
  - {origin: hand_base_link, task: pinky_middle, origin_kp: 0, task_kp: 18, scale: 1.545}
  - {origin: hand_base_link, task: pinky_distal, origin_kp: 0, task_kp: 19, scale: 1.693}
  - {origin: hand_base_link, task: pinky_distal, origin_kp: 0, task_kp: 20, task_offset: [-0.0135, 0.0, 0.0188], scale: 1.62}

  mediapipe_rotation:
    right: {x: -10.0, y: 0.0, z: -10.0}
    left: {x: 10.0, y: 0.0, z: 10.0}

render:
  camera:
    azimuth: 180
    elevation: 20.0
    distance: 0.5
