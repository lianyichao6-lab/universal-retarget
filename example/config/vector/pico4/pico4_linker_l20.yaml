# Linker L20 - KeyVectorOptimizer (Pico 4 input)

optimizer:
  type: "KeyVectorOptimizer"

robot:
  type: "linker_l20"

retarget:
  huber_delta: 2.0
  norm_delta: 0.04
  lp_alpha: 0.4
  mcp_lateral_scale: 0.60
  thumb_scale: 1.0
  thumb_inward_offset: -0.05

  segment_scaling:
    thumb: [1.727, 1.53, 1.417]
    index: [1.617, 1.624, 1.579]
    middle: [1.58, 1.548, 1.47]
    ring: [1.613, 1.613, 1.55]
    pinky: [1.806, 1.821, 1.74]

  key_vectors:
    # thumb
    - {origin: right_hand_base_link, task: right_t_mcp_link, origin_kp: 0, task_kp:  2, scale: 1.466}
    - {origin: right_hand_base_link, task: right_t_ip_link,      origin_kp: 0, task_kp:  3, scale: 1.586}
    - {origin: right_hand_base_link, task: right_t_tip,         origin_kp: 0, task_kp:  4, scale: 1.338}
    # index
    - {origin: right_hand_base_link, task: right_if_pip_link,    origin_kp: 0, task_kp:  6, scale: 1.476}
    - {origin: right_hand_base_link, task: right_if_dip_link,      origin_kp: 0, task_kp:  7, scale: 1.581}
    - {origin: right_hand_base_link, task: right_if_tip,         origin_kp: 0, task_kp:  8, scale: 1.522}
    # middle
    - {origin: right_hand_base_link, task: right_mf_pip_link,   origin_kp: 0, task_kp: 10, scale: 1.469}
    - {origin: right_hand_base_link, task: right_mf_dip_link,     origin_kp: 0, task_kp: 11, scale: 1.536}
    - {origin: right_hand_base_link, task: right_mf_tip,        origin_kp: 0, task_kp: 12, scale: 1.452}
    # ring
    - {origin: right_hand_base_link, task: right_rf_pip_link,     origin_kp: 0, task_kp: 14, scale: 1.469}
    - {origin: right_hand_base_link, task: right_rf_dip_link,       origin_kp: 0, task_kp: 15, scale: 1.575}
    - {origin: right_hand_base_link, task: right_rf_tip,          origin_kp: 0, task_kp: 16, scale: 1.51}
    # pinky
    - {origin: right_hand_base_link, task: right_lf_pip_link,    origin_kp: 0, task_kp: 18, scale: 1.545}
    - {origin: right_hand_base_link, task: right_lf_dip_link,      origin_kp: 0, task_kp: 19, scale: 1.693}
    - {origin: right_hand_base_link, task: right_lf_tip,         origin_kp: 0, task_kp: 20, scale: 1.62}

  mediapipe_rotation:
    x: -7.0
    y: 0.0
    z: -100.0

render:
  camera:
    azimuth: 90
    elevation: 0.0
    distance: 0.7
