# LinkerHand L21 - KeyVectorOptimizer (Pico 4 input)

optimizer:
  type: "KeyVectorOptimizer"

robot:
  type: "linkerhand_l21"

retarget:
  huber_delta: 2.0
  norm_delta: 0.04
  lp_alpha: 0.4

  key_vectors:
    # thumb
    - {origin: hand_base_link, task: thumb_metacarpals, origin_kp: 0, task_kp:  2, scale: 1.466}
    - {origin: hand_base_link, task: thumb_distal,      origin_kp: 0, task_kp:  3, scale: 1.586}
    - {origin: hand_base_link, task: thumb_tip,         origin_kp: 0, task_kp:  4, scale: 1.338}
    # index
    - {origin: hand_base_link, task: index_proximal,    origin_kp: 0, task_kp:  6, scale: 1.476}
    - {origin: hand_base_link, task: index_middle,      origin_kp: 0, task_kp:  7, scale: 1.581}
    - {origin: hand_base_link, task: index_tip,         origin_kp: 0, task_kp:  8, scale: 1.522}
    # middle
    - {origin: hand_base_link, task: middle_proximal,   origin_kp: 0, task_kp: 10, scale: 1.469}
    - {origin: hand_base_link, task: middle_middle,     origin_kp: 0, task_kp: 11, scale: 1.536}
    - {origin: hand_base_link, task: middle_tip,        origin_kp: 0, task_kp: 12, scale: 1.452}
    # ring
    - {origin: hand_base_link, task: ring_proximal,     origin_kp: 0, task_kp: 14, scale: 1.469}
    - {origin: hand_base_link, task: ring_middle,       origin_kp: 0, task_kp: 15, scale: 1.575}
    - {origin: hand_base_link, task: ring_tip,          origin_kp: 0, task_kp: 16, scale: 1.51}
    # pinky
    - {origin: hand_base_link, task: pinky_proximal,    origin_kp: 0, task_kp: 18, scale: 1.545}
    - {origin: hand_base_link, task: pinky_middle,      origin_kp: 0, task_kp: 19, scale: 1.693}
    - {origin: hand_base_link, task: pinky_tip,         origin_kp: 0, task_kp: 20, scale: 1.62}

  mediapipe_rotation:
    x: 0.0
    y: 0.0
    z: -20.0

render:
  camera:
    azimuth: 180
    elevation: -20
    distance: 0.5
