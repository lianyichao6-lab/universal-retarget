# Gaia Hand20 - KeyVectorOptimizer (Pico 4 input)
# Gaia Hand20 scaling calibrated from Pico 4 right-hand tracking data.
# Scale values from wuji-retargeting-private/config/vector/vector_pico4.yaml

optimizer:
  type: "KeyVectorOptimizer"

robot:
  type: "gaia_hand20"

retarget:
  huber_delta: 2.0
  norm_delta: 0.04
  # Keep the four human MCP points from the transformed Pico input.
  align_four_mcp_to_robot: false
  lp_alpha: 0.2

  key_vectors:
    # thumb (thumb)
  - {origin: right_base_link, task: right_thumb_link_3, origin_kp: 0, task_kp: 2,
      scale: 1.263}
  - {origin: right_base_link, task: right_thumb_link_4, origin_kp: 0, task_kp: 3,
    scale: 1.232}
  - {origin: right_base_link, task: right_thumb_tip, origin_kp: 0, task_kp: 4,
      scale: 1.3801}
    # index (index)
  - {origin: right_base_link, task: right_index_link_3, origin_kp: 0, task_kp: 6,
    scale: 1.407}
  - {origin: right_base_link, task: right_index_link_4, origin_kp: 0, task_kp: 7,
    scale: 1.485}
  - {origin: right_base_link, task: right_index_tip, origin_kp: 0, task_kp: 8,
      scale: 1.455}
    # middle (middle)
  - {origin: right_base_link, task: right_middle_link_3, origin_kp: 0, task_kp:
      10, scale: 1.369}
  - {origin: right_base_link, task: right_middle_link_4, origin_kp: 0, task_kp:
      11, scale: 1.417}
  - {origin: right_base_link, task: right_middle_tip, origin_kp: 0, task_kp: 12,
      scale: 1.315}
    # ring (ring)
  - {origin: right_base_link, task: right_ring_link_3, origin_kp: 0, task_kp: 14,
    scale: 1.405}
  - {origin: right_base_link, task: right_ring_link_4, origin_kp: 0, task_kp: 15,
    scale: 1.486}
  - {origin: right_base_link, task: right_ring_tip, origin_kp: 0, task_kp: 16,
      scale: 1.403}
    # pinky (little)
  - {origin: right_base_link, task: right_little_link_3, origin_kp: 0, task_kp:
      18, scale: 1.579}
  - {origin: right_base_link, task: right_little_link_4, origin_kp: 0, task_kp:
      19, scale: 1.578}
  - {origin: right_base_link, task: right_little_tip, origin_kp: 0, task_kp: 20,
      scale: 1.552}

  mediapipe_rotation:
    x: -7.0
    y: -3.0
    z: -10.0

render:
  camera:
    azimuth: 135
    elevation: -20
    distance: 0.5
