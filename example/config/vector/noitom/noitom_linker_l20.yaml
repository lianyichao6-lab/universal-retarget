# Linker L20 - KeyVectorOptimizer (Noitom PNS-G input)

optimizer:
  type: "KeyVectorOptimizer"

robot:
  type: "linker_l20"

retarget:
  huber_delta: 2.0
  norm_delta: 0.04
  lp_alpha: 0.4
  mcp_lateral_scale: 0.60
  thumb_scale: 1.0
  thumb_inward_offset: -0.05

  key_vectors:
    # thumb
    - {origin: right_hand_base_link, task: right_t_mcp_link, origin_kp: 0, task_kp:  2, scale: 1.181}
    - {origin: right_hand_base_link, task: right_t_ip_link,      origin_kp: 0, task_kp:  3, scale: 1.313}
    - {origin: right_hand_base_link, task: right_t_tip,         origin_kp: 0, task_kp:  4, scale: 1.5}
    # index
    - {origin: right_hand_base_link, task: right_if_pip_link,    origin_kp: 0, task_kp:  6, scale: 1.331}
    - {origin: right_hand_base_link, task: right_if_dip_link,      origin_kp: 0, task_kp:  7, scale: 1.412}
    - {origin: right_hand_base_link, task: right_if_tip,         origin_kp: 0, task_kp:  8, scale: 1.367}
    # middle
    - {origin: right_hand_base_link, task: right_mf_pip_link,   origin_kp: 0, task_kp: 10, scale: 1.375}
    - {origin: right_hand_base_link, task: right_mf_dip_link,     origin_kp: 0, task_kp: 11, scale: 1.414}
    - {origin: right_hand_base_link, task: right_mf_tip,        origin_kp: 0, task_kp: 12, scale: 1.366}
    # ring
    - {origin: right_hand_base_link, task: right_rf_pip_link,     origin_kp: 0, task_kp: 14, scale: 1.397}
    - {origin: right_hand_base_link, task: right_rf_dip_link,       origin_kp: 0, task_kp: 15, scale: 1.451}
    - {origin: right_hand_base_link, task: right_rf_tip,          origin_kp: 0, task_kp: 16, scale: 1.401}
    # pinky
    - {origin: right_hand_base_link, task: right_lf_pip_link,    origin_kp: 0, task_kp: 18, scale: 1.45}
    - {origin: right_hand_base_link, task: right_lf_dip_link,      origin_kp: 0, task_kp: 19, scale: 1.589}
    - {origin: right_hand_base_link, task: right_lf_tip,         origin_kp: 0, task_kp: 20, scale: 1.536}

  mediapipe_rotation:
    x: -7.0
    y: 0.0
    z: -100.0

render:
  camera:
    azimuth: 90
    elevation: 0.0
    distance: 0.7
