# LinkerHand L25 adaptive configuration calibrated from L25 FK and right.mp4 MediaPipe data.
# Tip offsets come from the L25 distal STL audit; see reports/l25_tip_offset_audit.md.

optimizer:
  type: "AdaptiveOptimizerAnalytical"

robot:
  type: "linkerhand_l25"

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 5.0
  w_dir: 1.0
  project_tip_dir: false
  w_full_hand: 1.0
  pinch_scaling: 1.0
  alpha: 1.0
  segment_scaling:
    thumb: [1.208, 1.122, 1.106]
    index: [1.451, 1.385, 1.335]
    middle: [1.473, 1.405, 1.354]
    ring: [1.509, 1.487, 1.445]
    pinky: [1.632, 1.68, 1.676]

  pinch_thresholds:
    index: {d1: 2.0, d2: 4.0}
    middle: {d1: 2.0, d2: 4.0}
    ring: {d1: 2.0, d2: 4.0}
    pinky: {d1: 2.0, d2: 4.0}

  # Fitted from 254 right.mp4 MediaPipe frames by calibrate_rotation.py.
  # Coordinate-frame calibration is shared with the vector configuration.
  mediapipe_rotation:
    x: -4.9
    y: -3.8
    z: -24.4

  lp_alpha: 0.4

render:
  camera:
    azimuth: 180
    elevation: 20
    distance: 0.5
