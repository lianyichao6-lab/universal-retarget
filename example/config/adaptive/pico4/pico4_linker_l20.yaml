# Linker L20 Configuration for Retargeting

optimizer:
  type: "AdaptiveOptimizerAnalytical"

robot:
  type: "linker_l20"

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 1.0
  w_dir: 5.0
  scaling: 1.2
  project_tip_dir: false
  w_full_hand: 1.0
  segment_scaling:
    thumb: [1.727, 1.53, 1.4985]
    index: [1.517, 1.524, 1.4016]
    middle: [1.48, 1.448, 1.312]
    ring: [1.613, 1.613, 1.4917]
    pinky: [1.806, 1.821, 1.6778]

  pinch_thresholds:
    index: {d1: 2.0, d2: 4.0}
    middle: {d1: 2.0, d2: 4.0}
    ring: {d1: 2.0, d2: 4.0}
    pinky: {d1: 2.0, d2: 4.0}

  # apply_mediapipe_transformations() yields mirrored Y axes for the
  # two hands.  Mirror the fixed palm-frame correction as well so the input
  # palm normal/width axes remain aligned with the L20 base frame.
  mediapipe_rotation:
    right: {x: -10.0, y: 0.0, z: -10.0}
    left:  {x:  10.0, y: 0.0, z:  10.0}

  lp_alpha: 0.4

render:
  camera:
    azimuth: 180
    elevation: 0.0
    distance: 0.7
