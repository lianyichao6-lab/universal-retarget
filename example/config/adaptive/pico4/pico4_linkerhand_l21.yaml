# LinkerHand L21 Configuration for Retargeting

optimizer:
  type: "AdaptiveOptimizerAnalytical"

robot:
  type: "linkerhand_l21"

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 5.0
  w_dir: 1.0
  project_tip_dir: false
  w_full_hand: 1.0
  pinch_scaling: 1.5044
  alpha: 1.0
  lateral_scaling: 0.85

  segment_scaling:
    thumb: [2.256, 0.637, 3.076, 0.597]
    index: [1.594, 1.053, 2.103, 1.042]
    middle: [1.717, 0.887, 1.782, 0.88]
    ring: [1.707, 0.942, 2.15, 1.035]
    pinky: [1.526, 1.496, 2.619, 1.146]

  pinch_thresholds:
    index: {d1: 2.0, d2: 4.0}
    middle: {d1: 2.0, d2: 4.0}
    ring: {d1: 2.0, d2: 4.0}
    pinky: {d1: 2.0, d2: 4.0}

  mediapipe_rotation:
    x: -5.0
    y: 0.0
    z: -20.0

  lp_alpha: 0.4

render:
  camera:
    azimuth: 180
    elevation: -20
    distance: 0.5
