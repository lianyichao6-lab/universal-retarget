# LinkerHand L21 Configuration for Retargeting

optimizer:
  type: "AdaptiveOptimizerAnalytical"

robot:
  type: "linkerhand_l21"

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 1.0
  w_dir: 5.0
  scaling: 1.2
  project_tip_dir: false
  w_full_hand: 1.0
  pinch_full_hand_weight: 0.2  # retain 20% FullHandVec posture objective during pinch

  segment_scaling:
    thumb:  [1.466, 1.586, 1.338]
    index:  [1.476, 1.581, 1.522]
    middle: [1.469, 1.536, 1.452]
    ring:   [1.469, 1.575, 1.51]
    pinky:  [1.545, 1.693, 1.62]

  pinch_thresholds:
    index:  { d1: 2.0, d2: 4.0 }
    middle: { d1: 2.0, d2: 4.0 }
    ring:   { d1: 2.0, d2: 4.0 }
    pinky:  { d1: 2.0, d2: 4.0 }

  mediapipe_rotation:
    x: -5.0
    y: 0.0
    z: -20.0

  lp_alpha: 0.4

render:
  camera:
    azimuth: 180
    elevation: -20
    distance: 0.5
