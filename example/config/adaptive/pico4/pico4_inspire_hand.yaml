# Inspire Hand Configuration for Retargeting
# 5 fingers with mimic joints

optimizer:
  type: "AdaptiveOptimizerAnalytical"

robot:
  type: "inspire_hand"
  urdf_path: "assets/inspire_hand/inspire_hand_right.urdf"

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 1.0
  w_dir: 5.0
  scaling: 1.0
  project_tip_dir: false
  w_full_hand: 1.0

  segment_scaling:
    thumb: [1.106, 1.301, 1.35]
    index: [1.175, 1.20, 1.327]
    middle: [1.130, 1.18, 1.31]
    ring: [1.15, 1.22, 1.356]
    pinky: [1.276, 1.32, 1.459]

  pinch_thresholds:
    index: {d1: 2.0, d2: 8.0}
    middle: {d1: 2.0, d2: 4.0}
    ring: {d1: 2.0, d2: 4.0}
    pinky: {d1: 2.0, d2: 4.0}

  mediapipe_rotation:
    x: -7.0
    y: 0.0
    z: -20.0

  lp_alpha: 0.4

render:
  camera:
    azimuth: 180
    elevation: -20
    distance: 0.5
