# Inspire Hand Configuration for Retargeting
# 5 fingers with mimic joints

optimizer:
  type: "AdaptiveOptimizerAnalytical"

robot:
  type: "inspire_hand"
  urdf_path: "assets/inspire_hand/inspire_hand_right.urdf"

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 5.0
  w_dir: 1.0
  project_tip_dir: false
  w_full_hand: 1.0

  pinch_scaling: 1.3444
  alpha: 1.0
  segment_scaling:
    thumb: [1.891, 0.995, 0.995, 1.675]
    index: [1.622, 0.543, 0.543, 2.146]
    middle: [1.669, 0.458, 0.458, 1.931]
    ring: [1.745, 0.508, 0.508, 2.131]
    pinky: [1.712, 0.735, 0.735, 1.945]

  pinch_thresholds:
    index: {d1: 2.0, d2: 8.0}
    middle: {d1: 2.0, d2: 4.0}
    ring: {d1: 2.0, d2: 4.0}
    pinky: {d1: 2.0, d2: 4.0}

  mediapipe_rotation:
    x: -7.0
    y: 0.0
    z: -20.0

  lp_alpha: 0.4

render:
  camera:
    azimuth: 180
    elevation: -20
    distance: 0.5
