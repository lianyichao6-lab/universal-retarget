schema_version: 1
status: target_machine_values_required

# Native Luban AR5-5_08 + right LinkerHand L25 deployment contract.
# Set LUBAN_FRAMEWORK_ROOT in the shell; this file deliberately does not copy
# Luban's ROS workspace or vendor SDK into this Python package.
luban:
  framework_root: ${LUBAN_FRAMEWORK_ROOT}
  arm_model: AR5-5_08R-W4C4A6-ZY2
  arm_joint_names: [r_joint_1, r_joint_2, r_joint_3, r_joint_4, r_joint_5, r_joint_6, r_joint_7]
  arm_controller: /right_arm_controller
  arm_action: /right_arm_controller/follow_joint_trajectory
  hand_model: L25
  hand_joint_names:
    - r_hand_thumb_cmc_roll
    - r_hand_thumb_cmc_yaw
    - r_hand_thumb_cmc_pitch
    - r_hand_thumb_mcp
    - r_hand_index_mcp_roll
    - r_hand_index_mcp_pitch
    - r_hand_index_pip
    - r_hand_middle_mcp_roll
    - r_hand_middle_mcp_pitch
    - r_hand_middle_pip
    - r_hand_ring_mcp_roll
    - r_hand_ring_mcp_pitch
    - r_hand_ring_pip
    - r_hand_pinky_mcp_roll
    - r_hand_pinky_mcp_pitch
    - r_hand_pinky_pip
  hand_controller: /right_hand_controller/commands
  joint_states: /joint_states
  simulation_urdf: src/robot_model/evo_work/ar5_l25_with_table.urdf
  simulation_scene_generator: scripts/tools/generate_ar508_l25_cumotion_scene.py
  real_arm_health_check: scripts/rokae/check_arm_health.sh
  real_hand_launch: linkerhand_hardware/launch/launch_l25_hand.py

frames:
  world: world
  arm_base: r_base_link
  # The bundled AR5/L25 URDF exposes r_tcp as the fixed mount parent.
  arm_flange: r_tcp
  hand_base: r_hand_base_link
  camera_anchor: waist_camera_color_optical_frame

planning:
  hand_qpos_units: radians
  arm_qpos_units: radians
  arm_dof: 7
  hand_active_dof: 16
  l25_qpos_dof: 21
  execution_order: [pregrasp, approach, close, lift, release]

safety:
  mock_first: true
  arm_speed_scale: 0.1
  require_arm_health_check: true
  require_ik: true
  require_collision_check: true
  require_operator_confirmation: true
  require_emergency_stop: true
