schema_version: 1
status: target_machine_values_required

robot:
  arm_model: REQUIRED
  base_frame: REQUIRED
  flange_frame: REQUIRED
  teach_mode_available: true

hand:
  model: linkerhand_l25
  side: right
  base_frame: REQUIRED
  can_interface: can0
  flange_to_hand_transform: REQUIRED_ON_TARGET

cameras:
  anchor: hand
  hand:
    model: orbbec_gemini335lg
    serial_number: REQUIRED
    color_optical_frame: hand_camera_color_optical_frame
    depth_registered_to_color: true
    flange_to_camera_transform: REQUIRED_ON_TARGET
    transform_is_dynamic: true
  head:
    model: stereolabs_zed2i
    serial_number: REQUIRED
    color_optical_frame: REQUIRED_ON_TARGET
    depth_registered_to_color: true
    base_to_camera_transform: REQUIRED_ON_TARGET
    transform_is_dynamic: REQUIRED_ON_TARGET

planning:
  reconstruction_backend: hunyuan3d2-multiview
  reconstruction_backends:
    - hunyuan3d2-multiview
    - 3dgenerationpipeline-metric
  reconstruction_contract: reconstruction_schema_v1
  grasp_execution_contract: grasp_execution_schema_v1
  pregrasp_offset_hand_m: REQUIRED_AFTER_TEACH_VALIDATION
  operator_confirmation_required: true

luban_bridge:
  arm_target_topic: /right_arm/target_pose
  arm_motion_done_topic: /right_arm/motion_done
  hand_command_topic: /right_hand_controller/commands
  hand_motion_done_topic: /right_hand/motion_done
  diagnostic_wrist_topic: /anydex/right_l25_wrist_goal
  active_hand_joint_count: 16
  command_units: radians
  capture_pose_file: anchor_pose.npz

safety:
  arm_speed_scale: 0.1
  hand_speed: 20
  hand_torque: 25
  require_ik: true
  require_arm_collision_check: true
  require_emergency_stop: true
  automatic_hardware_execution: false
